# MyFinanda taxonomy for the finance skills.
#
# category_to_group: the export's own hierarchy (ענף -> קבוצת ענפים).
#   The ledger does NOT store the group; Skill 3 reconstructs it from the
#   category via this table. Do not usually edit this section.
#
# group_to_bucket: YOUR coarse analysis buckets. Edit the right-hand side to
#   remap a group to a bucket like eat / sleep / fly / drive / show / shop.
#   Defaults to identity (group -> itself).
#
# category_to_bucket: optional per-category overrides (win over group_to_bucket).
#
# Edit the PER-PROJECT copy at <project>/category_map.yaml; the master under
# the skill folder is the shared fallback.

